<!DOCTYPE html>
<html lang="ru"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Гран-при Ф1</title>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Semi+Condensed:wght@500;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#f2f3f5;--sf:#fff;--ln:#e0e3e8;--tx:#14171c;--mu:#6b7380;--ac:#e10600;--hd:'Barlow Semi Condensed','Arial Narrow',system-ui,sans-serif;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#101216;--sf:#181b21;--ln:#272b34;--tx:#eceff4;--mu:#8a93a3}}
:root[data-theme="dark"]{--bg:#101216;--sf:#181b21;--ln:#272b34;--tx:#eceff4;--mu:#8a93a3}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--tx);font:15px/1.4 system-ui,-apple-system,Segoe UI,Roboto,sans-serif}
header{display:flex;align-items:center;justify-content:space-between;padding:14px 16px 8px;gap:8px}
h1{font:700 26px var(--hd);margin:0;letter-spacing:.2px;display:flex;align-items:center;gap:4px}
h1 .ynav{display:inline-flex;align-items:center;gap:2px}
h1 .ynav button{border:0;background:none;color:var(--ac);font:700 22px var(--hd);padding:4px 8px;min-height:36px;cursor:pointer;border-radius:8px}
h1 .ynav button:hover{background:rgba(225,6,0,.1)}
h1 .ynav button:disabled{opacity:.25;cursor:default}
h1 small{color:var(--mu);font-weight:500}
button,input,select{font:inherit;color:inherit}
button{background:var(--sf);border:1px solid var(--ln);border-radius:10px;padding:9px 14px;cursor:pointer;min-height:40px}
button:focus-visible,input:focus-visible{outline:2px solid var(--ac);outline-offset:1px}
.pr{background:var(--ac);border-color:var(--ac);color:#fff}.dg{color:#d33}
input[type=text],input[type=number],select{background:var(--bg);border:1px solid var(--ln);border-radius:8px;padding:8px 10px;min-height:40px;width:100%}
main{padding:0 12px 96px}
.tw{overflow-x:auto;background:var(--sf);border:1px solid var(--ln);border-radius:14px}
table{border-collapse:collapse;width:max-content;min-width:100%}
th,td{padding:9px 8px;text-align:center;border-bottom:1px solid var(--ln);white-space:nowrap}
tbody tr[data-act]{cursor:pointer}tbody tr:hover td{background:rgba(127,127,127,.07)}
.s1{position:sticky;left:0;background:var(--sf);text-align:left;z-index:1;padding-left:14px;min-width:170px;font-weight:600;border-right:1px solid var(--ln)}
.s1 i{font-style:normal;font-size:11px;color:var(--ac);margin-left:4px}
.s1 .rn{color:var(--mu);font-weight:500;font-size:12px;margin-right:6px;font-variant-numeric:tabular-nums}
.th{font:700 14px var(--hd);border-bottom:3px solid var(--c);border-left:1px solid var(--ln)}
.dn{font:500 12px var(--hd);color:var(--mu)}.tt{border-right:0}
td.tt,th.tt{font-weight:700;background:rgba(127,127,127,.06)}
td{font-variant-numeric:tabular-nums}
tfoot td,tfoot th{border-bottom:0;font-weight:700;border-top:2px solid var(--ln)}
.card{background:var(--sf);border:1px solid var(--ln);border-radius:14px;padding:14px;margin-bottom:12px}
.li{display:flex;align-items:center;gap:10px;padding:8px 0;border-bottom:1px solid var(--ln)}.li:last-child{border:0}
.li b{font:700 17px var(--hd);min-width:28px}.li .nm{flex:1}.li .pt{width:64px;text-align:center}
.li .df{min-width:52px;text-align:right;font:500 13px system-ui;color:var(--mu);font-variant-numeric:tabular-nums}
.dot{width:10px;height:10px;border-radius:50%;flex:none}
.chips{display:flex;flex-wrap:wrap;gap:8px}.chips button{display:flex;align-items:center;gap:7px}
.seg{display:flex;gap:6px;margin-bottom:12px}.seg button{flex:1}.seg .on{background:var(--tx);color:var(--bg);border-color:var(--tx)}
.bar{display:flex;height:8px;border-radius:4px;overflow:hidden;background:var(--ln);margin-top:8px}
.sc{font:700 24px var(--hd);display:flex;justify-content:space-between;align-items:baseline}
.sc span{font:500 14px system-ui;color:var(--mu)}
nav{position:fixed;left:0;right:0;bottom:0;display:flex;background:var(--sf);border-top:1px solid var(--ln);padding:6px 8px calc(6px + env(safe-area-inset-bottom,0px));gap:4px}
nav button{flex:1;border:0;background:none;font-weight:600;color:var(--mu);font-size:13px;padding:8px 2px}nav .on{color:var(--tx);box-shadow:inset 0 -3px 0 var(--ac);border-radius:0}
.row{display:flex;gap:8px;align-items:center;margin-bottom:8px}.row>*{flex:1}.row .n{flex:none}
.sheet{position:fixed;inset:0;background:var(--bg);overflow:auto;padding:calc(12px + env(safe-area-inset-top,0px)) 14px 40px;z-index:5}
.rr{display:grid;grid-template-columns:1fr 1fr 1fr;gap:6px;margin-bottom:6px}
.mu{color:var(--mu);font-size:13px}.gap{margin-top:14px}
textarea{width:100%;height:90px;background:var(--bg);color:var(--tx);border:1px solid var(--ln);border-radius:8px;padding:8px}
#toast{position:fixed;left:50%;transform:translateX(-50%);bottom:84px;background:var(--tx);color:var(--bg);padding:10px 16px;border-radius:10px;z-index:9;max-width:90%;display:none}
.em{text-align:center;padding:40px 16px}.em p{color:var(--mu)}
.gc{cursor:pointer}.gh{display:flex;justify-content:space-between;align-items:baseline;gap:8px;margin-bottom:8px}.gh b{font:700 19px var(--hd)}
.tb{border-left:4px solid var(--c);background:rgba(127,127,127,.06);border-radius:8px;padding:7px 10px;margin-top:8px}
.tn{display:flex;gap:10px;align-items:baseline;font:700 15px var(--hd)}.tn b{font-size:18px}.tn span:first-child{flex:1}
.dr{display:flex;align-items:baseline;gap:8px;padding:3px 0}.dr>span:first-child{flex:1}.dr b{min-width:26px;text-align:right}.dr .mu i{font-style:normal;margin-left:8px}
.dash-card{background:#0d1117;border:1px solid #21262d;border-radius:14px;padding:16px 14px 12px;margin-bottom:12px;color:#e6edf3}
.dash-card .seg button{background:#161b22;border-color:#30363d;color:#8b949e}.dash-card .seg .on{background:#e6edf3;color:#0d1117;border-color:#e6edf3}
.dash-title{font:700 18px var(--hd);margin:0 0 12px;color:#e6edf3}
.chart-box{position:relative;width:100%;height:min(58vh,520px);min-height:340px;user-select:none}
.chart-box svg{display:block;width:100%;height:100%}
.stand-pop{position:absolute;top:8px;right:8px;width:200px;max-height:calc(100% - 16px);overflow:auto;background:#161b22ee;border:1px solid #30363d;border-radius:10px;padding:10px 12px;font-size:12px;backdrop-filter:blur(8px);z-index:2}
.stand-pop .hd{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:8px;font-weight:700;font-size:13px}
.stand-pop .hd span{color:#8b949e;font-weight:500;font-size:11px}
.stand-pop .row{display:flex;align-items:center;gap:6px;padding:2px 0;font-variant-numeric:tabular-nums}
.stand-pop .row b{min-width:16px;color:#8b949e;font-weight:500}
.stand-pop .row .nm{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.stand-pop .row .pt{font-weight:600;min-width:28px;text-align:right}
.chart-hint{font-size:12px;color:#8b949e;margin:8px 0 0}
.badge{display:inline-block;font-size:11px;font-weight:600;padding:2px 7px;border-radius:6px;background:rgba(127,127,127,.12);color:var(--mu);margin-left:6px}
.badge.ok{background:rgba(34,160,90,.15);color:#1a9a52}.badge.warn{background:rgba(225,6,0,.1);color:var(--ac)}
.cmp{display:grid;grid-template-columns:28px 1fr auto auto;gap:6px 10px;align-items:center;padding:6px 0;border-bottom:1px solid var(--ln);font-variant-numeric:tabular-nums}
.cmp:last-child{border:0}.cmp .delta{min-width:36px;text-align:right;font-weight:600}.cmp .delta.up{color:#1a9a52}.cmp .delta.dn{color:#d33}.cmp .act{color:var(--mu);min-width:28px;text-align:right}
.score-box{display:flex;flex-wrap:wrap;gap:10px 16px;margin-top:8px}.score-box b{font:700 18px var(--hd)}.score-box span{color:var(--mu);font-size:13px}
</style></head><body>
<div id="app"></div><div id="toast"></div>
<script>
const R=[25,18,15,12,10,8,6,4,2,1],SP=[8,7,6,5,4,3,2,1];
const T0=[["McLaren","#ff8000","Lando Norris","Oscar Piastri"],["Ferrari","#e8002d","Charles Leclerc","Lewis Hamilton"],["Red Bull","#3671c6","Max Verstappen","Isack Hadjar"],["Mercedes","#27c7a8","George Russell","Kimi Antonelli"],["Aston Martin","#229971","Fernando Alonso","Lance Stroll"],["Alpine","#ff87bc","Pierre Gasly","Franco Colapinto"],["Williams","#3aa7e0","Alexander Albon","Carlos Sainz"],["Racing Bulls","#6692ff","Liam Lawson","Arvid Lindblad"],["Haas","#9aa0a6","Esteban Ocon","Oliver Bearman"],["Audi","#a05a2c","Nico Hulkenberg","Gabriel Bortoleto"],["Cadillac","#e0b100","Valtteri Bottas","Sergio Perez"]];
function init(){let n=0;return{year:2026,gps:[],teams:T0.map(t=>({n:t[0],c:t[1]})),drv:T0.flatMap((t,i)=>[t[2],t[3]].map(x=>({id:'d'+n++,n:x,s:[{t:i,f:1,u:null}]})))}}
function mig(o){if(!o.drv){o.drv=o.teams.flatMap((t,i)=>t.d.map(d=>({id:d.id,n:d.n,s:[{t:i,f:1,u:null}]})));o.teams.forEach(t=>delete t.d)}if(o.gps)o.gps.forEach(g=>{if(g.y==null)g.y=o.year||2025});return o}
let S=init();
const V={tab:'gps',gp:null,mode:'r',set:false,del:false,dashMode:'d',dashIdx:null,booting:true};
const save=()=>{try{localStorage.setItem('f1app',JSON.stringify(S))}catch(e){}};
const SHARED='./data.json';
async function boot(){
 let local=null;try{local=JSON.parse(localStorage.getItem('f1app'))}catch(e){}
 let shared=null;
 try{const r=await fetch(SHARED,{cache:'no-store'});if(r.ok)shared=await r.json()}catch(e){}
 if(local&&local.teams&&(local.gps||[]).length){S=mig(local)}
 else if(shared&&shared.teams){S=mig(shared);save();toast('Загружены общие данные сайта')}
 else if(local&&local.teams){S=mig(local)}
 else{S=init()}
 V.booting=false;render()}
function downloadData(){
 const blob=new Blob([JSON.stringify(S)],{type:'application/json'});
 const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='data.json';a.click();URL.revokeObjectURL(a.href);
 toast('Скачан data.json — положите файл в корень репозитория GitHub и сделайте commit')}
async function loadShared(){
 try{const r=await fetch(SHARED,{cache:'no-store'});if(!r.ok)throw 0;const o=await r.json();if(!o.teams)throw 0;S=mig(o);save();V.set=false;render();toast('Общие данные с сайта загружены')}
 catch(e){toast('Файл data.json на сайте не найден. Опубликуйте его через «Скачать data.json».')}}
const $=s=>document.querySelector(s),esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const drs=()=>S.drv,gp=()=>S.gps.find(g=>g.id==V.gp);
const sn=n=>n.trim().split(' ').pop().slice(0,3).toUpperCase();
const fl=g=>g.race.length||g.spr.length;
const gy=g=>g.y!=null?g.y:S.year;
const gkey=g=>gy(g)*100+g.r;
const sortGps=a=>[...a].sort((x,y)=>gkey(x)-gkey(y));
const tm=(d,g)=>{if(g.at&&g.at[d.id]!=null)return g.at[d.id];const r=g.r;const z=d.s.find(x=>r>=x.f&&(x.u==null||r<=x.u));return z?z.t:-1};
const part=(g,id)=>g.race.includes(id)||g.spr.includes(id)||g.q.includes(id);
const dc=(d,g)=>{const t=tm(d,g);return t<0?'#888':S.teams[t].c};
const tn=(d,g)=>{const t=tm(d,g);return t<0?'вне команды':esc(S.teams[t].n)};
const last=d=>d.s[d.s.length-1].t;
function pts(g,k,id){const L=k=='r'?g.race:g.spr,T=k=='r'?R:SP,o=g.ov[k+id];if(o!=null)return o;const i=L.indexOf(id);return i>=0&&i<T.length?T[i]:0}
const tot=(g,id)=>pts(g,'r',id)+pts(g,'s',id);
const yearGps=()=>sortGps(S.gps.filter(g=>gy(g)===S.year));
const yearsList=()=>{const ys=new Set(S.gps.map(gy));ys.add(S.year);return[...ys].sort((a,b)=>a-b)};
const dT=id=>yearGps().reduce((a,g)=>a+tot(g,id),0);
const dTi=(d,i)=>yearGps().reduce((a,g)=>a+(tm(d,g)==i?tot(g,d.id):0),0);
const tP=(i,g)=>S.drv.reduce((a,d)=>a+(tm(d,g)==i?tot(g,d.id):0),0);
const tT=i=>yearGps().reduce((a,g)=>a+tP(i,g),0);
function toast(m){const t=$('#toast');t.textContent=m;t.style.display='block';clearTimeout(toast.h);toast.h=setTimeout(()=>t.style.display='none',3500)}
function ensurePred(g){if(!g.pred)g.pred={race:[],spr:[]};if(!g.pred.race)g.pred.race=[];if(!g.pred.spr)g.pred.spr=[];return g.pred}
function predScore(g){
 const pred=(g.pred&&g.pred.race)||[],act=g.race||[];
 if(!pred.length||!act.length)return null;
 let exact=0,close=0,podium=0;
 pred.forEach((id,i)=>{const a=act.indexOf(id);if(a<0)return;if(a===i)exact++;else if(Math.abs(a-i)<=1)close++;if(i<3&&a<3)podium++});
 const winner=pred[0]===act[0];
 const score=exact*5+close*2+(winner?10:0)+podium*3;
 return{exact,close,winner,podium,score,n:pred.length}}
function hasPred(g){return g.pred&&((g.pred.race&&g.pred.race.length)||(g.pred.spr&&g.pred.spr.length))}

function tableView(){
 const G=yearGps();
 if(!G.length)return`<div class="em"><h2>Нет гран-при за ${S.year}</h2><p>Переключите год стрелками или загрузите расписание сезона.</p><button class="pr" data-act="new">Добавить гран-при</button> <button data-act="set">Загрузить расписание</button></div>`;
 const hasRes=G.some(fl);
 // только пилоты, реально выступавшие за команду в этом сезоне (по результатам этапов)
 const C2=S.teams.map((t,i)=>{
  if(hasRes){
   return S.drv.filter(d=>G.some(g=>fl(g)&&tm(d,g)===i&&part(g,d.id))).sort((a,b)=>dTi(b,i)-dTi(a,i)||a.n.localeCompare(b.n));
  }
  return S.drv.filter(d=>d.s.some(z=>z.t===i&&(z.u==null||z.u>=1)));
 });
 const show=i=>C2[i].length>0||G.some(g=>tP(i,g)>0);
 let h='<div class="tw"><table><thead><tr><th class="s1" rowspan="2">Гран-при</th>';
 S.teams.forEach((t,i)=>{if(!show(i))return;h+=`<th colspan="${Math.max(C2[i].length,0)+1}" class="th" style="--c:${t.c}">${esc(t.n)}</th>`});
 h+='</tr><tr>';
 S.teams.forEach((t,i)=>{if(!show(i))return;C2[i].forEach(d=>h+=`<th class="dn">${esc(sn(d.n))}</th>`);h+='<th class="dn tt">Σ</th>'});
 h+='</tr></thead><tbody>';
 G.forEach(g=>{const f=fl(g);
  h+=`<tr data-act="open" data-id="${g.id}"><th class="s1"><span class="rn">${g.r}</span>${esc(g.n)}${g.sp?'<i>спринт</i>':''}</th>`;
  S.teams.forEach((t,i)=>{if(!show(i))return;C2[i].forEach(d=>h+=`<td>${f?(tm(d,g)==i&&part(g,d.id)?tot(g,d.id):''):'·'}</td>`);h+=`<td class="tt">${f?tP(i,g):'·'}</td>`});
  h+='</tr>'});
 h+='</tbody><tfoot><tr><th class="s1">Всего очков</th>';
 S.teams.forEach((t,i)=>{if(!show(i))return;C2[i].forEach(d=>h+=`<td>${dTi(d,i)}</td>`);h+=`<td class="tt">${tT(i)}</td>`});
 return h+'</tr></tfoot></table></div><p class="mu" style="padding:0 4px">Сезон ${S.year}. В колонках — только пилоты, выступавшие за команду в этом сезоне. Нажмите на строку, чтобы открыть гран-при.</p>'}

function standView(){
 const Y=yearGps();
 const teamOf=d=>{for(let i=Y.length-1;i>=0;i--){const t=tm(d,Y[i]);if(t>=0&&part(Y[i],d.id))return t}return last(d)};
 const D=S.drv.filter(d=>Y.some(g=>part(g,d.id))).map(d=>{const ti=teamOf(d);return{n:d.n,c:ti>=0?S.teams[ti].c:'#888',sub:ti>=0?S.teams[ti].n:'',p:dT(d.id)}}).sort((a,b)=>b.p-a.p);
 const T=S.teams.map((t,i)=>({n:t.n,c:t.c,p:tT(i),i})).filter(t=>Y.some(g=>S.drv.some(d=>tm(d,g)===t.i&&part(g,d.id)))).sort((a,b)=>b.p-a.p);
 if(!D.length&&!T.length)return`<div class="em"><h2>Нет зачёта за ${S.year}</h2><p>Нужны результаты этапов выбранного сезона.</p></div>`;
 const lst=A=>A.map((x,i)=>{const df=i===0?'—':(x.p-A[i-1].p);const dfs=df===0?'0':(df>0?'+'+df:String(df));
  return`<div class="li"><b>${i+1}</b><span class="dot" style="background:${x.c}"></span><span class="nm">${esc(x.n)}${x.sub?`<div class="mu">${esc(x.sub)}</div>`:''}</span><b>${x.p}</b><span class="df">${dfs}</span></div>`}).join('');
 const hd=t=>`<h3 style="margin:0 0 6px;font:700 18px var(--hd)">${t}</h3>`;
 return`<div class="card">${hd('Командный зачёт · '+S.year)}${lst(T)}</div><div class="card">${hd('Личный зачёт · '+S.year)}${lst(D)}</div>`}

function matesView(){const P={},K=(i,x,y)=>i+x.id+y.id;const Y=yearGps();
 S.teams.forEach((t,i)=>{const c=S.drv.filter(d=>Y.some(g=>tm(d,g)===i));if(c.length>1){const pairs=[];for(let a=0;a<c.length;a++)for(let b=a+1;b<c.length;b++)pairs.push([c[a],c[b]]);pairs.forEach(([x,y])=>{P[K(i,x,y)]={i,x,y,a:0,b:0}})}});
 Y.forEach(g=>S.teams.forEach((t,i)=>{const m=S.drv.filter(d=>tm(d,g)==i&&(!fl(g)||part(g,d.id)));if(m.length<2)return;for(let a=0;a<m.length;a++)for(let b=a+1;b<m.length;b++){const x=m[a],y=m[b],p=P[K(i,x,y)]||(P[K(i,x,y)]={i,x,y,a:0,b:0}),u=g.q.indexOf(x.id),v=g.q.indexOf(y.id);if(u<0&&v<0)return;if(v<0||(u>=0&&u<v))p.a++;else p.b++}}));
 const rows=Object.values(P).filter(p=>p.a+p.b>0).sort((p,q)=>p.i-q.i);
 if(!rows.length)return`<div class="em"><h2>Нет сравнений за ${S.year}</h2><p>Нужны результаты квалификации выбранного сезона.</p></div>`;
 return rows.map(p=>{const t=S.teams[p.i],s=p.a+p.b||1;
  return`<div class="card"><div class="sc"><span style="color:var(--tx)">${esc(p.x.n)}</span>${p.a} : ${p.b}<span style="color:var(--tx)">${esc(p.y.n)}</span></div><div class="bar"><i style="width:${p.a/s*100}%;background:${t.c}"></i><i style="width:${p.b/s*100}%;background:${t.c};opacity:.35"></i></div><div class="mu" style="margin-top:6px">${esc(t.n)} · ${S.year}: сравнений квалификации — ${p.a+p.b}</div></div>`}).join('')}

function gpFlag(g){const n=norm(g.n||'').replace(/grand prix|gp/g,'').trim();for(const[k,f]of Object.entries(FLAG))if(n.includes(k))return f;return '🏁'}
function gpShort(g){const n=(g.n||'').replace(/\s*Grand Prix\s*/i,'').trim();return n||('R'+g.r)}

function pointsChart(done,mode){
 const n=done.length;if(!n)return'<p class="mu">Нет данных</p>';
 const isDrv=mode==='d';
 // cumulative points series
 const series=[];
 if(isDrv){
  S.drv.forEach(d=>{let c=0;const pts=[];done.forEach(g=>{c+=tot(g,d.id);pts.push(c)});if(pts.some(p=>p>0))series.push({id:d.id,n:d.n,short:sn(d.n),c:S.teams[last(d)].c,pts})});
 }else{
  S.teams.forEach((t,i)=>{let c=0;const pts=[];done.forEach(g=>{c+=tP(i,g);pts.push(c)});if(pts.some(p=>p>0))series.push({id:'t'+i,n:t.n,short:t.n,c:t.c,pts})});
 }
 series.sort((a,b)=>b.pts[n-1]-a.pts[n-1]);
 const maxY=Math.max(...series.map(s=>s.pts[n-1]),10);
 const stepY=maxY<=50?10:maxY<=150?25:maxY<=300?50:100;
 const yMax=Math.ceil(maxY/stepY)*stepY||stepY;
 const W=Math.max(720,n*42+90),H=400,padL=44,padR=18,padT=18,padB=40;
 const x=i=>padL+(n===1?0:(W-padL-padR)*i/(n-1));
 const y=v=>padT+(H-padT-padB)*(1-v/yMax);
 let grid='';
 for(let v=0;v<=yMax;v+=stepY)grid+=`<line x1="${padL}" y1="${y(v)}" x2="${W-padR}" y2="${y(v)}" stroke="#21262d" stroke-width="1"/><text x="${padL-8}" y="${y(v)+4}" text-anchor="end" font-size="11" fill="#8b949e" font-family="system-ui">${v}</text>`;
 let paths='',dots='';
 series.forEach(s=>{let d='';s.pts.forEach((p,i)=>{const px=x(i),py=y(p);d+=(i?' L':'M')+px+','+py;dots+=`<circle cx="${px}" cy="${py}" r="3" fill="${s.c}" class="dc" data-i="${i}" data-id="${s.id}"/>`});
  paths+=`<path d="${d}" fill="none" stroke="${s.c}" stroke-width="2.2" stroke-linejoin="round" stroke-linecap="round" opacity=".92"/>`});
 let flags='';done.forEach((g,i)=>{flags+=`<text x="${x(i)}" y="${H-12}" text-anchor="middle" font-size="14">${gpFlag(g)}</text>`});
 const idx=V.dashIdx!=null?V.dashIdx:n-1;
 const cx=x(idx);
 const cursor=`<line x1="${cx}" y1="${padT}" x2="${cx}" y2="${H-padB}" stroke="#484f58" stroke-width="1.5" stroke-dasharray="4 3"/><circle cx="${cx}" cy="${padT}" r="0"/>`;
 // hit areas for selection
 let hits='';done.forEach((g,i)=>{const hx=x(i),hw=n>1?(W-padL-padR)/(n-1)/2:40;hits+=`<rect x="${hx-hw}" y="${padT}" width="${hw*2}" height="${H-padT-padB}" fill="transparent" data-act="dashi" data-i="${i}" style="cursor:pointer"/>`});
 // standings at idx
 const stand=series.map(s=>({n:s.short||s.n,c:s.c,p:s.pts[idx]})).sort((a,b)=>b.p-a.p);
 const gAt=done[idx];
 const pop=`<div class="stand-pop"><div class="hd"><span>${gpFlag(gAt)} ${esc(gpShort(gAt))}</span><span>R${gAt.r}</span></div>${stand.map((s,i)=>`<div class="row"><b>${i+1}</b><span class="nm" style="color:${s.c}">${esc(s.n)}</span><span class="pt">${s.p}</span></div>`).join('')}</div>`;
 return`<div class="chart-box" id="chartBox"><svg viewBox="0 0 ${W} ${H}" preserveAspectRatio="xMidYMid meet" id="chartSvg">${grid}${paths}${dots}${flags}${cursor}${hits}</svg>${pop}</div>
 <p class="chart-hint">Нажмите на этап (флаг), чтобы увидеть таблицу на этот момент · колесо — масштаб</p>`}

   ${sc?`<div class="score-box"><div><b>${sc.score}</b><br><span>очков прогноза</span></div><div><b>${sc.exact}</b><br><span>точных мест</span></div><div><b>${sc.close}</b><br><span>±1 место</span></div><div><b>${sc.winner?'✓':'—'}</b><br><span>победитель</span></div><div><b>${sc.podium}/3</b><br><span>подиум</span></div></div>
   <p class="mu" style="margin:8px 0 0">Начисление: точное место ×5, соседнее ×2, победитель +10, пилот в топ-3 угадан ×3</p>`:''}</div>`}
 return`<header style="max-width:760px;margin:0 auto"><button data-act="back">‹ Назад</button><button data-act="load">Загрузить из базы F1</button></header><main style="max-width:760px;margin:0 auto">
 <div class="card"><div class="row"><input type="text" data-f="n" value="${esc(g.n)}" aria-label="Название"><input class="n" style="width:84px" type="number" data-f="r" value="${g.r}" aria-label="Номер этапа"><input class="n" style="width:72px" type="number" data-f="y" value="${gy(g)}" aria-label="Год"></div>
 <div class="row"><label style="flex:1"><input type="checkbox" data-f="sp" ${g.sp?'checked':''}> Спринт-уикенд</label><button class="dg n" data-act="del">${V.del?'Точно удалить?':'Удалить'}</button></div></div>
 <div class="seg">${modes.map(m=>`<button class="${m[0]==k?'on':''}" data-act="mode" data-v="${m[0]}">${m[1]}</button>`).join('')}</div>
 ${cmp}
 <div class="card"><div class="mu">${isPred?'Ваш прогноз финиша гонки':k==='q'?'Порядок в квалификации':'Порядок финиша'}${isPred&&!g.race.length?' · введите до гонки':''}</div>${L.length?L.map(row).join(''):'<p class="mu">Нажимайте на пилотов ниже в порядке их места.</p>'}</div>

function bindChartZoom(){
 const box=$('#chartBox'),svg=$('#chartSvg');if(!box||!svg)return;
 let scale=1,tx=0,ty=0;
 const g=document.createElementNS('http://www.w3.org/2000/svg','g');
 while(svg.firstChild)g.appendChild(svg.firstChild);
 svg.appendChild(g);
 const apply=()=>g.setAttribute('transform',`translate(${tx},${ty}) scale(${scale})`);
 const pt=e=>{const r=svg.getBoundingClientRect(),vb=svg.viewBox.baseVal;return{x:vb.x+(e.clientX-r.left)/r.width*vb.width,y:vb.y+(e.clientY-r.top)/r.height*vb.height}};
 box.addEventListener('wheel',e=>{e.preventDefault();const p=pt(e),f=e.deltaY<0?1.12:1/1.12;const ns=Math.min(8,Math.max(0.5,scale*f));const k=ns/scale;tx=p.x-(p.x-tx)*k;ty=p.y-(p.y-ty)*k;scale=ns;apply()},{passive:false});
 let drag=null;
 box.addEventListener('pointerdown',e=>{if(e.button!==0||e.target.closest('[data-act=dashi]'))return;drag={x:e.clientX,y:e.clientY,ox:tx,oy:ty};box.setPointerCapture(e.pointerId)});
 box.addEventListener('pointermove',e=>{if(!drag)return;const r=svg.getBoundingClientRect(),vb=svg.viewBox.baseVal;tx=drag.ox+(e.clientX-drag.x)/r.width*vb.width;ty=drag.oy+(e.clientY-drag.y)/r.height*vb.height;apply()});
 box.addEventListener('pointerup',()=>{drag=null});
 box.addEventListener('dblclick',()=>{scale=1;tx=0;ty=0;apply()})}
function render(){const o=$('.sheet'),st=o?o.scrollTop:0;$('#app').innerHTML=(V.gp?gpView():mainView())+(V.set?setView():'');const n=$('.sheet');if(n)n.scrollTop=st;if(V.tab==='dash'&&!V.gp)bindChartZoom()}

const norm=s=>s.normalize('NFD').replace(/[\u0300-\u036f]/g,'').toLowerCase();
const API='https://api.jolpi.ca/ergast/f1/';
async function jget(u){const r=await fetch(u);if(!r.ok)throw new Error(r.status);return(await r.json()).MRData.RaceTable}
async function sched(){
 try{const T=await jget(API+S.year+'.json');let n=0;
  T.Races.forEach(r=>{if(S.gps.some(g=>g.r==+r.round&&gy(g)==S.year))return;S.gps.push({id:'g'+r.round+Date.now(),n:r.raceName,r:+r.round,y:S.year,sp:!!r.Sprint,race:[],spr:[],q:[],ov:{},pred:{race:[],spr:[]}});n++});
  S.gps=sortGps(S.gps);save();V.set=false;render();toast('Добавлено гран-при: '+n)}
 catch(e){toast('Не удалось связаться с базой F1. В предпросмотре это заблокировано; на GitHub Pages должно работать.')}}
let MS=[];
async function syncAll(){
 try{toast('Загружаю расписание…');const T=await jget(API+S.year+'.json');
  T.Races.forEach(r=>{let g=S.gps.find(x=>x.r==+r.round&&gy(x)==S.year);if(!g){g={id:'g'+r.round+Date.now(),n:r.raceName,r:+r.round,y:S.year,sp:!!r.Sprint,race:[],spr:[],q:[],ov:{},pred:{race:[],spr:[]}};S.gps.push(g)}if(!g.n||g.n=='Новый гран-при')g.n=r.raceName;g.d=r.date;g.y=S.year;if(r.Sprint)g.sp=true});
  S.gps=sortGps(S.gps);save();render()}
 catch(e){toast('Не удалось загрузить расписание. Проверьте сезон и подключение.');return}
 const td=new Date().toISOString().slice(0,10),todo=S.gps.filter(g=>gy(g)==S.year&&g.d&&g.d<=td&&(!fl(g)||!g.at));let n=0,ok=0,stop=false;MS=[];
 for(const g of todo){toast('Загружаю '+(++n)+' из '+todo.length+': '+g.n);const r=await loadGp(g);if(r<0){stop=true;break}if(r>0)ok++;await new Promise(z=>setTimeout(z,1200))}
 const ms=[...new Set(MS)];
 toast('Загружено этапов: '+ok+(stop?'. Остановлено из-за ошибки, повторите позже — загрузятся только недостающие.':'.')+(ms.length?' Добавлены новые пилоты: '+ms.join(', ')+'.':''))}
async function loadHist(){
 const cur=new Date().getFullYear(),from=2020;let totalOk=0,stop=false;MS=[];
 for(let y=from;y<=cur;y++){
  toast('Год '+y+': расписание…');
  try{const T=await jget(API+y+'.json');
   T.Races.forEach(r=>{let g=S.gps.find(x=>x.r==+r.round&&gy(x)==y);if(!g){g={id:'g'+y+'r'+r.round+Date.now(),n:r.raceName,r:+r.round,y:y,sp:!!r.Sprint,race:[],spr:[],q:[],ov:{},pred:{race:[],spr:[]}};S.gps.push(g)}if(!g.n||g.n=='Новый гран-при')g.n=r.raceName;g.d=r.date;g.y=y;if(r.Sprint)g.sp=true});
   S.gps=sortGps(S.gps);save()}
  catch(e){toast('Не удалось загрузить '+y);continue}
  const td=new Date().toISOString().slice(0,10);
  const todo=S.gps.filter(g=>gy(g)==y&&g.d&&g.d<=td&&(!fl(g)||!g.at));
  let n=0;
  for(const g of todo){toast(y+': '+(++n)+'/'+todo.length+' — '+g.n);const r=await loadGp(g);if(r<0){stop=true;break}if(r>0)totalOk++;await new Promise(z=>setTimeout(z,1100))}
  if(stop)break}
 const ms=[...new Set(MS)];
 V.set=false;render();
 toast('История: загружено этапов '+totalOk+(stop?'. Остановлено, можно повторить.':'')+(ms.length?'. Новые пилоты: '+ms.join(', '):''))}
async function loadGp(g){
 try{const yr=gy(g),b=API+yr+'/'+g.r+'/',miss=new Set(),ti=n=>{const k=norm(n);return k?S.teams.findIndex(t=>{const u=norm(t.n);return k.includes(u)||u.includes(k)}):-1},m=a=>a.map(x=>{const c=drs().filter(d=>norm(d.n.split(' ').pop())==norm(x.Driver.familyName)),T=ti(x.Constructor?.name||'');let d=c.find(d=>tm(d,g)>=0)||c[0];if(!d){d={id:'d'+Date.now()+x.Driver.familyName,n:x.Driver.givenName+' '+x.Driver.familyName,s:[{t:Math.max(T,0),f:g.r,u:g.r}]};S.drv.push(d);miss.add(d.n)}if(T>=0){if(!g.at)g.at={};g.at[d.id]=T}return d.id});
  const F=async p=>(await jget(b+p+'.json')).Races[0];
  const[a,q,s]=await Promise.all([F('results'),F('qualifying'),F('sprint').catch(()=>null)]);
  if(!a&&!q){toast('Для этого этапа данных пока нет');return 0}
  g.at={};if(!g.n||g.n=='Новый гран-при')g.n=(a||q).raceName;const ra=a?.Results||[];g.race=m(ra);g.q=m(q?.QualifyingResults||[]);g.spr=m(s?.SprintResults||[]);if(g.spr.length)g.sp=true;
  MS.push(...miss);save();render();toast(miss.size?'Добавлены новые пилоты: '+[...miss].join(', ')+'. Проверьте имена в настройках':'Результаты загружены');return 1}
 catch(e){toast('Не удалось загрузить. Проверьте номер этапа и сезон; в предпросмотре сеть заблокирована.');return -1}}

document.addEventListener('click',e=>{const b=e.target.closest('[data-act]');if(!b)return;const d=b.dataset,a=d.act,g=V.gp&&gp(),i=+d.i;
 const L=g&&(V.mode=='r'?g.race:V.mode=='s'?g.spr:V.mode=='q'?g.q:(ensurePred(g).race));if(a!='del')V.del=false;if(a!='delp')V.dd=null;
 if(a=='tab')V.tab=d.v;else if(a=='open'){V.gp=d.id;V.mode='r'}else if(a=='back')V.gp=null;else if(a=='mode')V.mode=d.v;
 else if(a=='yprev'){S.year=S.year-1;V.dashIdx=null;save()}
 else if(a=='ynext'){S.year=S.year+1;V.dashIdx=null;save()}
 else if(a=='dashm'){V.dashMode=d.v;render();return}
 else if(a=='dashi'){V.dashIdx=+d.i;render();return}
 else if(a=='add')L.push(d.id);
 else if(a=='rm'){delete g.ov[V.mode+L[i]];L.splice(i,1)}
 else if(a=='up'){if(i>0)[L[i-1],L[i]]=[L[i],L[i-1]]}
 else if(a=='new'){const n={id:'g'+Date.now(),n:'Новый гран-при',r:S.gps.filter(x=>gy(x)==S.year).length+1,y:S.year,sp:false,race:[],spr:[],q:[],ov:{},pred:{race:[],spr:[]}};S.gps.push(n);V.gp=n.id;V.mode='r'}
 else if(a=='del'){if(V.del){S.gps=S.gps.filter(x=>x!==g);V.gp=null;V.del=false}else V.del=true}
 else if(a=='addp'){const v=S.drv.find(z=>z.id==d.id),l=v.s[v.s.length-1],f=Math.max(0,...S.gps.filter(fl).map(g=>g.r))+1;if(l.u==null&&f-1>=l.f)l.u=f-1;v.s.push({t:l.t,f,u:null})}
 else if(a=='newd'){const f=Math.max(0,...S.gps.filter(fl).map(g=>g.r))+1;S.drv.push({id:'d'+Date.now(),n:'Новый пилот',s:[{t:0,f,u:null}]})}
 else if(a=='delp'){if(V.dd==d.id){S.drv=S.drv.filter(z=>z.id!=d.id);S.gps.forEach(g=>['race','spr','q'].forEach(k=>g[k]=g[k].filter(x=>x!=d.id)));V.dd=null}else V.dd=d.id}
 else if(a=='set')V.set=true;else if(a=='x')V.set=false;
 else if(a=='sched')return sched();else if(a=='sync')return syncAll();else if(a=='hist')return loadHist();else if(a=='load')return loadGp(g);
 else if(a=='publish')return downloadData();
 else if(a=='loadshared')return loadShared();
 else if(a=='show'){$('#bk').value=JSON.stringify(S);return}
 else if(a=='restore'){try{const o=JSON.parse($('#bk').value);if(!o.teams||!o.gps)throw 0;S=mig(o);toast('Данные восстановлены')}catch(x){toast('Текст копии не распознан');return}}
 save();render()});
document.addEventListener('change',e=>{const x=e.target,d=x.dataset,g=V.gp&&gp();
 if(d.f){const v=x.type=='checkbox'?x.checked:x.type=='number'?+x.value:x.value;if(d.f==='y')g.y=+x.value;else g[d.f]=v;if(d.f=='sp'){if(!x.checked){g.spr=[];if(V.mode=='s')V.mode='r'}save();render();return}}
 else if(d.ov){x.value===''?delete g.ov[d.ov]:g.ov[d.ov]=+x.value}
 else if(d.t!=null)S.teams[d.t].n=x.value;
 else if(d.dn)S.drv.find(z=>z.id==d.dn).n=x.value;
 else if(d.sg){const[id,j,f]=d.sg.split(':'),z=S.drv.find(q=>q.id==id).s[j];z[f]=f=='t'?+x.value:x.value===''?null:+x.value}
 else if(d.year){S.year=+x.value;V.dashIdx=null}
 save()});
boot();
</script></body></html>
